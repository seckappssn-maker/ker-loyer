:root{--bg:#F7F2EC;--card:#FFFFFF;--ink:#26180F;--muted:#6E5E52;--line:#E6DBD0;--accent:#A8482A;--accent-soft:#F6E1D6;--on-accent:#fff;--busy:#E9DFD6;--ok:#2E7D4F;--ok-soft:#E1F1E6;--danger:#B42318;--danger-soft:#FBE3E0;--wa:#1F8F4E;

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 60px}
.top{display:flex;justify-content:flex-end;padding:12px 0 0}
.lang{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
.hero{padding:18px 0 8px}.hero .k{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}

.btn.wa{background:var(--wa);color:#fff}.btn.line{background:var(--card);border:1px solid var(--line);color:var(--ink)}.btn.full{width:100%}.btn.big{font-size:18px;padding:17px;font-family:var(--display);font-weight:800}
.btn:disabled{opacity:.45;cursor:default}.btn svg{width:20px;height:20px;fill:currentColor}
.units{display:flex;flex-direction:column;gap:18px;margin-top:22px}

.sum b{font-family:var(--display);font-size:26px}

input{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:17px;width:100%;min-width:0}

function setLang(l){LANG=l;try{localStorage.setItem('kerLoyer.lang',l);}catch(e){}document.documentElement.lang=l==='wo'?'wo':'fr';render();if(SEL.u)openCal(SEL.u.id,true);}

// Données
let V=null,P={},ERR='',SEL={u:null,a:'',z:'',ym:''};
function demo(){const T=todayISO();return{info:{nom:'Famille Seck',ville:'Dakar',tel:'778790006',desc:'Appartements et villa meublés, propres et calmes. Clim, wifi, gardien 24h/24. Paiement Wave ou Orange Money.',
  units:[{id:'v',name:'Villa F4 avec piscine',genre:'Maison / Villa',desc:'4 chambres, piscine, cuisine équipée, 5 min de la plage',pers:8,prixNuit:85000,prixSemaine:500000,prixMois:1500000,lieu:'Saly Portudal, Mbour',busy:[[addDays(T,-2),addDays(T,8)],[addDays(T,15),addDays(T,19)]]},
   {id:'s',name:'Studio meublé',genre:'Studio',desc:'1 chambre, clim, wifi, balcon',pers:2,prixNuit:25000,prixSemaine:150000,prixMois:450000,lieu:'Liberté 6, Dakar',busy:[[T,addDays(T,3)],[addDays(T,5),addDays(T,7)]]},
   {id:'c',name:'Chambre meublée',genre:'Chambre',desc:'Grand lit, salle de bain privée',pers:2,prixNuit:15000,prixSemaine:90000,prixMois:300000,lieu:'Saly Portudal, Mbour',busy:[[addDays(T,-10),addDays(T,20)]]}]},photos:{}};}
async function load(){const q=new URLSearchParams(location.search);let id=(q.get('id')||location.hash.replace('#','')||'').trim();
  if(!id||/^demo$/i.test(id)){V=demo();V.demo=true;P=V.photos;render();return;}
  const t0=Date.now();while(!window.supabase&&Date.now()-t0<7000)await new Promise(r=>setTimeout(r,150));
  if(!window.supabase){ERR='net';render();return;}
  try{const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false}});const r=await sb.rpc('loyer_vitrine',{p_id:id.toUpperCase()});if(r.error)throw r.error;
    if(!r.data||!r.data.info){ERR='off';render();return;}V=r.data;P=V.photos||{};document.title=t('Réserver')+' · '+(V.info.nom||'Kër Loyer');render();}
  catch(e){ERR='net';render();}}

const ICON_H='<svg viewBox="0 0 24 24"><path d="M4 21V9l8-5 8 5v12"/><path d="M9 21v-6h6v6"/><path d="M2 21h20"/></svg>';
const ICON_WA='<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8a10 10 0 0 1-4-3.6c-.3-.4-1-1.4-1-2.6s.7-1.8.9-2.1c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.1.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg>';
function busySet(u){const s=new Set();(u.busy||[]).forEach(([a,b])=>{for(let d=a;d<b;d=addDays(d,1))s.add(d);});return s;}
function render(){const app=document.getElementById('app');const top='<div class="top">'+(V&&V.demo&&history.length>1?'<button class="lang" style="margin-right:auto" onclick="history.back()">‹ Kër Loyer</button>':'')+'<button class="lang" data-lang="'+(LANG==='wo'?'fr':'wo')+'">'+(LANG==='wo'?'Français':'Wolof')+'</button></div>';
  if(ERR==='off'){app.innerHTML=top+'<div class="empty"><h2>'+t('Page introuvable')+'</h2><p>'+t("Ce lien n'est pas actif. Contactez le propriétaire.")+'</p></div>';return;}
  if(ERR==='net'){app.innerHTML=top+'<div class="empty"><p>'+t('Pas de connexion internet : réessayez.')+'</p><button class="btn" onclick="location.reload()">↻</button></div>';return;}
  if(!V){app.innerHTML='<div class="empty">Chargement…</div>';return;}const I=V.info,T=todayISO();
  app.innerHTML=top+'<header class="hero"><div class="k">'+(V.demo?t('Exemple')+' · ':'')+t('Réserver en ligne')+'</div><h1>'+esc(I.nom)+'</h1>'+(I.desc?'<p>'+esc(I.desc)+'</p>':'')+(I.ville?'<div class="where">📍 '+esc(I.ville)+'</div>':'')+
  '<div class="callrow"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+waNum(I.tel)+'">'+ICON_WA+t('Écrire sur WhatsApp')+'</a></div></header>'+
  '<div class="units">'+I.units.map(u=>{const ph=P[u.id]||[];const bs=busySet(u);const freeNow=!bs.has(T);
    return '<article class="unit"><div class="gal" data-g="'+u.id+'">'+(ph.length?ph.map(p=>'<img src="'+p+'" alt="'+esc(u.name)+'" loading="lazy">').join(''):'<div class="ph">'+ICON_H+'<span>'+esc(u.genre)+'</span></div>')+'</div>'+
    (ph.length>1?'<div class="dots" id="dots-'+u.id+'">'+ph.map((_,i)=>'<i class="'+(i?'':'on')+'"></i>').join('')+'</div>':'')+
    '<div class="ub"><h2>'+esc(u.name)+'</h2><div class="meta">'+esc([u.genre,u.pers?u.pers+' '+t('personnes max'):'',u.lieu].filter(Boolean).join(' · '))+'</div>'+(u.desc?'<div>'+esc(u.desc)+'</div>':'')+
    '<div class="prices"><div class="price"><b>'+F(u.prixNuit)+'</b>'+t('/ nuit')+'</div>'+(u.prixSemaine?'<div class="price"><b>'+F(u.prixSemaine)+'</b>'+t('/ semaine')+'</div>':'')+(u.prixMois?'<div class="price"><b>'+F(u.prixMois)+'</b>'+t('/ mois')+'</div>':'')+'</div>'+
    '<div class="free '+(freeNow?'y':'n')+'">● '+t(freeNow?"Libre aujourd'hui":"Occupé aujourd'hui")+'</div>'+
    '<button class="btn big" data-cal="'+u.id+'">'+t('Choisir les dates')+'</button></div></article>';}).join('')+'</div>'+
  '<div class="foot">Kër Loyer</div>';
  document.querySelectorAll('.gal').forEach(g=>g.addEventListener('scroll',()=>{const d=document.getElementById('dots-'+g.dataset.g);if(!d)return;const i=Math.round(g.scrollLeft/g.clientWidth);[...d.children].forEach((x,k)=>x.className=k===i?'on':'');},{passive:true}));}
function openCal(id,keep){const u=V.info.units.find(x=>x.id===id);if(!keep)SEL={u,a:'',z:'',ym:todayISO().slice(0,7)};SEL.u=u;drawCal();}
function drawCal(){const u=SEL.u,T=todayISO(),bs=busySet(u);const [y,m]=SEL.ym.split('-').map(Number);const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),off=(first.getDay()+6)%7;
  const ML=LANG==='wo'?MOIS_WO:MOIS;const dow=LANG==='wo'?['Alt','Tal','Àla','Alx','Àjj','Gaa','Dib']:['L','M','M','J','V','S','D'];
  let cells=dow.map(d=>'<div class="dow">'+d+'</div>').join('')+'<div></div>'.repeat(off);
  for(let d=1;d<=days;d++){const s=y+'-'+pad(m)+'-'+pad(d);let c='d';const past=s<T,busy=bs.has(s);
    if(past)c+=' past';else if(busy&&!(SEL.a&&!SEL.z&&s>SEL.a&&okRange(SEL.a,s,bs)))c+=' busy';
    if(SEL.a===s)c+=' a';if(SEL.z===s)c+=' z';if(SEL.a&&SEL.z&&s>SEL.a&&s<SEL.z)c+=' in';if(s===T)c+=' today';
    cells+='<button class="'+c+'" data-d="'+s+'"'+(past?' disabled':'')+'>'+d+'</button>';}
  const canPrev=SEL.ym>T.slice(0,7);const n=SEL.a&&SEL.z?diffDays(SEL.a,SEL.z):0;const tr=n?tarif(u,n):null;
  const hint=!SEL.a?t("Touchez le jour d'arrivée."):!SEL.z?t('Touchez maintenant le jour de départ.'):'';
  document.getElementById('sheetRoot').innerHTML='<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-label="'+esc(u.name)+'"><div class="sh"><h3>'+esc(u.name)+'</h3><button class="btn line" data-close="1" style="padding:10px 14px">'+t('Fermer')+'</button></div>'+
  '<p class="hint">'+(hint||t('Vos dates'))+'</p><div class="cal"><div class="calh"><button class="nav" data-mv="-1"'+(canPrev?'':' disabled')+' aria-label="Mois précédent">‹</button><b>'+ML[m-1]+' '+y+'</b><button class="nav" data-mv="1" aria-label="Mois suivant">›</button></div><div class="grid">'+cells+'</div>'+
  '<div class="legend"><span>'+t('Occupé')+'</span><span class="s">'+t('Vos dates')+'</span></div></div>'+
  (n?'<div class="sum"><span>'+t('Arrivée')+' '+fdate(SEL.a)+' → '+t('Départ')+' '+fdate(SEL.z)+'</span><span>'+n+' '+t(n>1?'nuits':'nuit')+(tr.tarif?' = '+tr.txt:'')+'</span><b>'+F(tr.tot)+'</b></div>'+
   '<form class="form" id="fRes"><div class="g2"><label class="f">'+t('Votre nom')+'<input id="cNom" autocomplete="name" required></label><label class="f">'+t('Personnes')+'<input id="cPers" inputmode="numeric" value="'+(u.pers?Math.min(2,u.pers):1)+'"></label></div>'+
   '<button class="btn wa big full" type="submit">'+ICON_WA+t('Envoyer la demande sur WhatsApp')+'</button><div class="note">'+t('Le propriétaire vous répond sur WhatsApp pour confirmer.')+'</div></form>':'')+'</div></div>';
  const ip=document.getElementById('cNom');if(ip&&SEL.nom)ip.value=SEL.nom;}
function okRange(a,z,bs){for(let d=a;d<z;d=addDays(d,1))if(bs.has(d))return false;return true;}
function pick(s){const bs=busySet(SEL.u);
  if(!SEL.a||SEL.z||s<=SEL.a){if(bs.has(s))return;SEL.a=s;SEL.z='';}
  else{if(!okRange(SEL.a,s,bs)){const sh=document.querySelector('.hint');if(sh)sh.textContent=t("Ces dates ne sont pas libres. Choisissez d'autres jours.");return;}SEL.z=s;}
  drawCal();if(SEL.z){const f=document.getElementById('fRes');if(f)f.scrollIntoView({behavior:'smooth',block:'nearest'});}}
function send(){const u=SEL.u,I=V.info,n=diffDays(SEL.a,SEL.z),tr=tarif(u,n);const nom=document.getElementById('cNom').value.trim();if(!nom){document.getElementById('cNom').focus();return;}
  const pers=document.getElementById('cPers').value.trim();
  const msg='Bonjour '+I.nom+', je veux réserver :\n*'+u.name+'*'+(u.lieu?' ('+u.lieu+')':'')+'\nArrivée : '+fdate(SEL.a)+'\nDépart : '+fdate(SEL.z)+'\n'+n+' nuit(s)'+(tr.tarif?' = '+tr.txt:'')+'\nTotal : *'+F(tr.tot)+'*\nNom : '+nom+(pers?'\nPersonnes : '+pers:'')+'\n\n(Demande envoyée depuis votre page Kër Loyer)';
  const l=document.createElement('a');l.href='https://wa.me/'+waNum(I.tel)+'?text='+encodeURIComponent(msg);l.target='_blank';l.rel='noopener';document.body.appendChild(l);l.click();l.remove();}
document.addEventListener('click',e=>{const L=e.target.closest('[data-lang]');if(L)return setLang(L.dataset.lang);
  const c=e.target.closest('[data-cal]');if(c)return openCal(c.dataset.cal);
  if(e.target.closest('[data-close]')&&(e.target.dataset.close||e.target.closest('button[data-close]'))){document.getElementById('sheetRoot').innerHTML='';SEL.u=null;return;}
  const mv=e.target.closest('[data-mv]');if(mv&&!mv.disabled){const [y,m]=SEL.ym.split('-').map(Number);const d=new Date(y,m-1+Number(mv.dataset.mv),1);SEL.ym=d.getFullYear()+'-'+pad(d.getMonth()+1);const ip=document.getElementById('cNom');if(ip)SEL.nom=ip.value;drawCal();return;}
  const d=e.target.closest('[data-d]');if(d&&!d.disabled){const ip=document.getElementById('cNom');if(ip)SEL.nom=ip.value;pick(d.dataset.d);}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='fRes')send();});
document.documentElement.lang=LANG==='wo'?'wo':'fr';load();
</script></body></html>
