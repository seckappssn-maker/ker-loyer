const rPaid=r=>(r.pays||[]).reduce((s,p)=>s+p.amount,0);
const liveResas=()=>S.resas.filter(r=>r.statut!=='annule');
function tarif(u,n){const pn=u.prixNuit||0,ps=u.prixSemaine||0,pm=u.prixMois||0;let rest=n,tot=0,m=0,wk=0;
  if(pm&&rest>=30){m=Math.floor(rest/30);rest-=m*30;}if(ps&&rest>=7){wk=Math.floor(rest/7);rest-=wk*7;}
  if(ps&&rest>0&&rest*pn>=ps){wk++;rest=0;}let small=wk*ps+rest*pn;if(pm&&small>=pm){m++;wk=0;rest=0;small=0;}
  tot=m*pm+small;const parts=[];if(m)parts.push(m+' mois');if(wk)parts.push(wk+' semaine'+(wk>1?'s':''));if(rest)parts.push(rest+' nuit'+(rest>1?'s':''));
  return{tot,txt:parts.join(' + '),tarif:!!(m||wk)};}
function prixTxt(u){if(u.mode!=='nuit')return F(u.loyer)+' / mois';const p=[F(u.prixNuit)+' / nuit'];if(u.prixSemaine)p.push(F(u.prixSemaine)+' / semaine');if(u.prixMois)p.push(F(u.prixMois)+' / mois');return p.join(' · ');}
let TOT_MAN=false;
function overlap(r,uid2,a,b){return r.unitId===uid2&&r.statut!=='annule'&&r.debut<b&&a<r.fin;}
const nightUnits=()=>S.units.filter(u=>u.mode==='nuit');
function unitStatus(u){const t=effToday();if(u.mode==='nuit'){const r=liveResas().find(r=>r.unitId===u.id&&r.debut<=t&&t<r.fin);return r?{busy:true,who:r.nom}:{busy:false};}
  const b=unitBail(u.id);return b?{busy:true,who:b.nom,b}:{busy:false};}
// Encaissements par période
function incomeIn(from,to){const inP=d=>d.slice(0,10)>=from&&d.slice(0,10)<=to;let loy=0,sej=0;const byBien={};
  S.pays.forEach(p=>{if(p.kind==='caution'||!inP(p.date))return;loy+=p.amount;const b=bail(p.bailId),u=b&&unit(b.unitId);const k=u?u.bienId:'';byBien[k]=(byBien[k]||0)+p.amount;});
  S.resas.forEach(r=>(r.pays||[]).forEach(p=>{if(!inP(p.date))return;sej+=p.amount;const u=unit(r.unitId);const k=u?u.bienId:'';byBien[k]=(byBien[k]||0)+p.amount;}));
  return{loy,sej,byBien};}
function depsIn(from,to){const l=S.deps.filter(d=>d.date.slice(0,10)>=from&&d.date.slice(0,10)<=to);const byBien={};l.forEach(d=>{byBien[d.bienId||'']=(byBien[d.bienId||'']||0)+d.amount;});return{tot:l.reduce((s,d)=>s+d.amount,0),byBien,list:l};}

function render(){const app=$('app');if(BOOTING){app.innerHTML='<div class="wrap"><div class="empty" style="padding-top:40vh">Chargement…</div></div>';return;}

  const chip=DEMO?'<button class="chip warn" data-act="quitDemo">Exemple · Quitter</button>':L.st==='blocked'?'<button class="chip bad" data-act="goSub">Abonnement expiré</button>':L.st==='grace'?'<button class="chip bad" data-act="goSub">Expiré · '+(GRACE_DAYS+L.left)+' j</button>':L.st==='warn'?'<button class="chip warn" data-act="goSub">'+(L.trial?'Essai':'Abonné')+' · '+L.left+' j</button>':'<button class="chip ok" data-act="goSub">'+(L.trial?'Essai gratuit':'Abonné')+'</button>';
  const V={home:vHome,loy:vLoy,maison:vMaison,lune:vSej,more:vMore,dep:vDep,rap:vRap,set:vSet,page:vPage}[tab]||vHome;
  app.innerHTML='<div class="wrap"><header class="top"><div class="brand">'+esc(S.me.name||'Kër Loyer')+'</div><div style="display:flex;gap:6px;align-items:center">'+(USER?'<span id="syncDot" class="sync '+syncSt+'">'+(syncSt==='ok'?'☁ ✓':syncSt==='err'?'☁ !':'☁ …')+'</span>':'')+langBtn()+chip+'</div></header>'+banner(L)+V()+'</div>'+
  '<nav class="tabs" style="grid-template-columns:repeat('+T.length+',1fr)">'+T.map(([k,l])=>'<button data-tab="'+k+'" aria-current="'+(tab===k||(k==='more'&&MORE_TABS.includes(tab)))+'">'+svg(k)+l+'</button>').join('')+'</nav>';}

  (nightUnits().length?'<button class="btn ghost" style="margin-top:10px" data-act="newResa">'+svg('lune')+'Nouvelle réservation</button>':'')+

function rowBail(b){const a=arrears(b),u=unit(b.unitId),st=bState(b),pu=paidUntil(b);

function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const M=900,k=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.62));};im.onerror=rej;im.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}

const PDFLIB={jspdf:['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'],h2c:['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js']};
const libP={};
function loadLib(k){if(libP[k])return libP[k];const urls=PDFLIB[k];
  libP[k]=new Promise((ok,ko)=>{let i=0;const nx=()=>{if(i>=urls.length){libP[k]=null;return ko(new Error('lib'));}const sc=document.createElement('script');sc.src=urls[i++];sc.onload=()=>ok();sc.onerror=()=>{sc.remove();nx();};document.head.appendChild(sc);};nx();});
  return libP[k];}
window.addEventListener('load',()=>setTimeout(()=>{loadLib('jspdf').catch(()=>{});loadLib('h2c').catch(()=>{});},2500));
const pdfSafe=t=>plain(t).replace(/[    ]/g,' ').replace(/[−–—]/g,'-').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/…/g,'...').replace(/✓/g,'OK').replace(/[^\n\x20-\x7E -ÿ]/g,'');
let PDF=null,DL=null;
try{if(window.claude&&typeof claude.use==='function')claude.use('downloads').then(d=>{DL=d||null;}).catch(()=>{});}catch(e){}
function pdfName(){const n=((S.me&&S.me.name)||'Ker-Loyer').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'')||'Carnet';return n+'-'+effToday()+'.pdf';}
async function snap(box){await new Promise(r=>setTimeout(r,60));const W=box.offsetWidth,H=box.offsetHeight;
  const sc=Math.max(0.6,Math.min(2,Math.sqrt(14e6/(W*H))));
  const cv=await html2canvas(box,{scale:sc,backgroundColor:'#ffffff',width:W,windowWidth:W});return{cv,W,H,sc};}
const toBlob=(cv,t,q)=>new Promise(ok=>cv.toBlob(ok,t,q));
async function makePdf(kind,data){toast('Préparation…');
  try{await loadLib('jspdf');await loadLib('h2c');}
  catch(e){toast('PDF impossible sans internet : connectez-vous une fois');return;}
  try{const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});let cvImg;
    if(kind==='text'){doc.setFont('courier','normal');doc.setFontSize(11);const lh=5.2,top=16,bot=284,left=14;let y=top;
      for(const raw of pdfSafe(data).split('\n')){const parts=raw===''?['']:doc.splitTextToSize(raw,182);
        for(const p of parts){if(y>bot){doc.addPage();y=top;}doc.text(p,left,y);y+=lh;}}
      const box=document.createElement('div');box.id='pdfArea';box.className='tick';box.textContent=plain(data).replace(/[  ]/g,' ');document.body.appendChild(box);
      try{cvImg=(await snap(box)).cv;}finally{box.remove();}}
    else{const box=document.createElement('div');box.id='pdfArea';box.innerHTML=data;document.body.appendChild(box);
      try{const base=box.getBoundingClientRect().top;
        const cuts=[...box.querySelectorAll('tr,h1,h2,h3,p,.kpi,.foot,.sub,table')].map(el=>Math.round(el.getBoundingClientRect().top-base)).filter(v=>v>0).sort((x,y)=>x-y);
        const {cv,W,H,sc}=await snap(box);cvImg=cv;const pageH=Math.floor(W*(277/190));let y0=0,first=true;
        while(y0<H-2){let y1=Math.min(y0+pageH,H);if(y1<H){const c=cuts.filter(v=>v>y0+pageH*0.5&&v<=y0+pageH);if(c.length)y1=c[c.length-1];}
          const pc=document.createElement('canvas');pc.width=cv.width;pc.height=Math.ceil((y1-y0)*sc);const cx=pc.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,pc.width,pc.height);
          cx.drawImage(cv,0,Math.floor(y0*sc),cv.width,pc.height,0,0,pc.width,pc.height);
          if(!first)doc.addPage();first=false;doc.addImage(pc.toDataURL('image/jpeg',0.92),'JPEG',10,10,190,(y1-y0)*190/W);y0=y1;}
      }finally{box.remove();}}
    const name=pdfName();if(PDF){PDF.url&&URL.revokeObjectURL(PDF.url);PDF.iurl&&URL.revokeObjectURL(PDF.iurl);}
    const blob=doc.output('blob');const img=await toBlob(cvImg,'image/png');
    PDF={blob,name,url:URL.createObjectURL(blob),img,iname:name.replace(/\.pdf$/,'.png'),iurl:img?URL.createObjectURL(img):''};
    openSheet('Aperçu','<div class="prev">'+(PDF.iurl?'<img src="'+PDF.iurl+'" alt="Aperçu">':'')+'</div>'+
      '<div class="small" style="margin:8px 0 10px">Vérifiez, puis choisissez comment l\'envoyer.</div><div class="stack">'+
      '<div class="grid2"><button class="btn" data-act="pdfShare">📄 Envoyer en PDF</button><button class="btn ghost" data-act="imgShare">🖼 Envoyer en image</button></div>'+
      (DL?'':'<button class="btn line" data-act="pdfPrint">🖨 Imprimer</button>')+
      '<div class="small">Le menu du téléphone s\'ouvre : choisissez WhatsApp, ou « Enregistrer dans Fichiers » / « Enregistrer l\'image ».</div></div>');}
  catch(e){toast('PDF impossible : réessayez');}}
async function shareFile(blob,name,type){if(!blob)return;
  if(DL){try{await DL.save({filename:name,data:blob});}catch(e){const c=e&&e.code;if(c==='declined')return;if(c==='rate_limited')return toast('Attendez un instant puis réessayez');toast('Envoi impossible ici : ouvrez l\'app depuis son icône');}return;}
  let f=null;try{f=new File([blob],name,{type});}catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
function pdfShare(){if(PDF)shareFile(PDF.blob,PDF.name,'application/pdf');}
function imgShare(){if(PDF)shareFile(PDF.img,PDF.iname,'image/png');}
function pdfOpen(){pdfShare();}
function pdfPrint(){if(!PDF)return;const w=window.open(PDF.url,'_blank');if(w){setTimeout(()=>{try{w.print();}catch(e){}},800);}else{try{window.print();}catch(e){toast('Impression impossible ici : utilisez « Envoyer »');}}}

function fullHTML(){const t=effToday(),d=new Date(),from=addDays(t,-29);const late=S.baux.filter(b=>arrears(b)>0).sort((a,b)=>arrears(b)-arrears(a));
  const pays=S.pays.filter(p=>p.date>=from).slice().reverse();const deps=S.deps.filter(x=>x.date>=from).slice().reverse();const res=liveResas().filter(r=>r.fin>=t).sort((a,b)=>a.debut.localeCompare(b.debut));
  return '<div class="rep">'+head('Copie complète · '+fdate(t)+' à '+pad(d.getHours())+':'+pad(d.getMinutes()))+
  '<h3>1. Impayés (total '+F(late.reduce((s,b)=>s+arrears(b),0))+')</h3>'+tb(['Locataire','Logement','Téléphone','Mois','Doit'],late.map(b=>[esc(b.nom)+(b.sortie?' (parti)':''),esc(unit(b.unitId).name),esc(b.tel||''),String(monthsLate(b)),F(arrears(b))]),[3,4])+
  '<h3>2. Locataires ('+S.baux.filter(active).length+')</h3>'+tb(['Locataire','Logement','Téléphone','Loyer','Entrée','Caution','Payé jusqu\'à'],S.baux.filter(active).map(b=>[esc(b.nom),esc(unit(b.unitId).name),esc(b.tel||''),F(curLoyer(b)),fdate(b.entree||b.debut),F(b.caution),paidUntil(b)?mLabel(paidUntil(b)):'—']),[3,5])+
  '<h3>3. Logements</h3>'+S.biens.map(bi=>'<p class="e"><b>'+esc(bi.name)+'</b>'+(bi.address?' · '+esc(bi.address):'')+(bi.proprio?' · propriétaire : '+esc(bi.proprio):'')+'</p>'+tb(['Logement','Type','Prix','État'],S.units.filter(u=>u.bienId===bi.id).map(u=>{const s=unitStatus(u);return[esc(u.name),esc(u.genre),prixTxt(u),s.busy?esc(s.who):'Libre'];}),[2])).join('')+
  (res.length?'<h3>4. Réservations en cours et à venir</h3>'+tb(['Client','Logement','Arrivée','Départ','Total','Reste'],res.map(r=>[esc(r.nom),esc(unit(r.unitId).name),fdate(r.debut),fdate(r.fin),F(r.total),F(r.total-rPaid(r))]),[4,5]):'')+
  '<h3>5. Paiements des 30 derniers jours</h3>'+tb(['Date','Locataire','Pour','Montant'],pays.map(p=>[fdate(p.date),esc(bail(p.bailId).nom),esc(coverText(p)),F(p.amount)]),[3])+
  '<h3>6. Dépenses des 30 derniers jours</h3>'+tb(['Date','Maison','Pour quoi','Montant'],deps.map(x=>[fdate(x.date),esc(x.bienId&&bien(x.bienId)?bien(x.bienId).name:'Général'),esc(x.cat+(x.note?' – '+x.note:'')),F(x.amount)]),[3])+
  '<div class="foot">Kër Loyer · copie du '+fdate(t)+' · Gardez cette feuille en lieu sûr.</div></div>';}
function rapHTML(){const [a,z,lab]=period();const inc=incomeIn(a,z),dp=depsIn(a,z),tot=inc.loy+inc.sej;
  return '<div class="rep">'+head('Bilan · '+esc(lab))+'<div class="kpi"><div><span>Loyers</span><b>'+F(inc.loy)+'</b></div>'+(inc.sej?'<div><span>Séjours</span><b>'+F(inc.sej)+'</b></div>':'')+'<div><span>Dépenses</span><b>'+F(dp.tot)+'</b></div><div><span>Bénéfice</span><b>'+F(tot-dp.tot)+'</b></div></div>'+
  '<h3>Par maison</h3>'+tb(['Maison','Encaissé','Dépenses','Bénéfice'],S.biens.map(b=>{const i=inc.byBien[b.id]||0,d=dp.byBien[b.id]||0;return[esc(b.name),F(i),F(d),F(i-d)];}),[1,2,3])+
  '<h3>Dépenses</h3>'+tb(['Date','Maison','Pour quoi','Montant'],dp.list.map(x=>[fdate(x.date),esc(x.bienId&&bien(x.bienId)?bien(x.bienId).name:'Général'),esc(x.cat+(x.note?' – '+x.note:'')),F(x.amount)]),[3])+
  '<div class="foot">Kër Loyer · '+fdate(effToday())+'</div></div>';}
function releveHTML(pro){const [a,z,lab]=period();const bs=S.biens.filter(b=>b.proprio===pro);const inc=incomeIn(a,z),dp=depsIn(a,z);let ti=0,tc=0,td=0;
  const rows=bs.map(b=>{const i=inc.byBien[b.id]||0,c=Math.round(i*(num(b.commission)||0)/100),d=dp.byBien[b.id]||0;ti+=i;tc+=c;td+=d;return[esc(b.name),F(i),F(c)+' ('+(num(b.commission)||0)+' %)',F(d),F(i-c-d)];});
  const late=S.baux.filter(b=>{const u=unit(b.unitId);return u&&bs.some(x=>x.id===u.bienId)&&arrears(b)>0;});
  return '<div class="rep">'+head('Relevé pour '+esc(pro)+' · '+esc(lab))+tb(['Maison','Encaissé','Commission','Dépenses','À reverser'],rows,[1,2,3,4])+
  '<div class="kpi"><div><span>Encaissé</span><b>'+F(ti)+'</b></div><div><span>Commission</span><b>'+F(tc)+'</b></div><div><span>Dépenses</span><b>'+F(td)+'</b></div><div><span>À reverser</span><b>'+F(ti-tc-td)+'</b></div></div>'+
  '<h3>Loyers impayés</h3>'+tb(['Locataire','Logement','Doit'],late.map(b=>[esc(b.nom),esc(unit(b.unitId).name),F(arrears(b))]),[2])+'<div class="foot">Kër Loyer · '+fdate(effToday())+'</div></div>';}

  if(t.id==='loyQ'){loyQ=t.value;const pos=t.selectionStart;render();const n=$('loyQ');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='xImp'||t.id==='xDate'){const b=document.querySelector('[data-act=endOk]');if(b)updEnd(b.dataset.id);}
  if(t.id==='rUnit'){TOT_MAN=false;updResaBox();}
  if(t.id==='uPhotos'&&t.files&&t.files.length){addPhotos(t.dataset.u,[...t.files]);}
  if(t.id==='vitOn'){if(DEMO){t.checked=!t.checked;return toast('Exemple : rien n\'est enregistré');}if(!w()){t.checked=!t.checked;return;}S.vit=S.vit||{};S.vit.on=t.checked;save();render();toast(t.checked?'Page de réservation activée':'Page de réservation arrêtée');}
  if(t.id==='nOld'&&t.checked){document.querySelectorAll('[data-act=avN]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.n==='0')));}
  if(t.hasAttribute&&t.hasAttribute('data-big')){document.documentElement.classList.toggle('big',t.checked);try{localStorage.setItem('kerLoyer.big',t.checked?'1':'0');}catch(x){}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.id;
  if(f==='fAuth')return doAuth();
  if(f==='fOn'){const n=val('onName').trim();if(!n)return toast('Écrivez votre nom');startShop({name:n,phone:val('onPhone').trim(),address:val('onAddr').trim()});}
  if(f==='fVit'){if(DEMO)return toast('Exemple : rien n\'est enregistré');S.vit=S.vit||{};S.vit.desc=val('vDesc').trim();S.vit.wa=val('vWa').trim();save();render();toast('Enregistré');}
  if(f==='fMe'){Object.assign(S.me,{name:val('mName').trim()||S.me.name,phone:val('mPhone').trim(),address:val('mAddr').trim(),pay:val('mPay').trim(),footer:val('mFoot').trim()});save();render();toast('Enregistré');}});
render();boot();

</script>
</body></html>
